<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChainQuest</title><link rel="stylesheet" href="css/common.css"><style>.run-coin-image{width:1.3em;height:1.3em;object-fit:contain;vertical-align:-.24em;margin:0 .15em}</style></head><body><div id="viewport"><main id="stage" aria-label="ChainQuest ゲーム画面"><div id="test-banner" class="test-banner" hidden>開発テストモード（通常セーブとは別）</div><section class="screen active" id="title"><h1 class="heading">ChainQuest<div class="subtitle">A STORY BEGINS</div></h1><div class="stack"><button class="btn" id="new">NEW GAME</button><button class="btn" id="continue">CONTINUE</button></div></section><section class="screen" id="select"><div class="panel"><div class="save-list" id="save-list"></div><div class="save-transfer"><button class="btn" id="save-export">バックアップをDL</button><button class="btn" id="save-import">バックアップを読み込む</button><input type="file" id="save-import-file" accept=".cqsave,.json,application/json" hidden></div></div><button class="btn back" data-go="title">戻る</button></section><section class="screen" id="home"><div class="coin" id="coin">COIN：0</div><button class="hero" id="hero">前田ノカ立ち絵<br>（画像差替予定）</button><div class="bubble" id="bubble" hidden></div><button class="btn save home-image-button" id="save">セーブ</button><nav class="menu"><button class="btn home-image-button" data-go="shop">ショップ</button><button class="btn home-image-button" data-go="adventure">冒険</button><button class="btn home-image-button" data-go="status">ステータス</button><button class="btn home-image-button" data-go="items-page">アイテム</button></nav><button class="btn home-image-button" data-go="collection" id="collection-home-button" hidden>コレクション</button></section><section class="screen" id="shop"><h2 class="heading">SHOP</h2><div class="shop-coins" id="shop-coin"></div><div class="shop-npc"></div><div class="shop-frame"><div class="shop-caption">アイテム</div><div class="shop-list" id="shop-list"></div></div><div class="shop-gacha"><article class="shop-gacha-card"><h3>装備ガチャ</h3><div class="gacha-mini-art" id="gacha-art-equipment">装備</div><p class="gacha-mini-status" id="gacha-equipment-status"></p><button class="small-btn gacha-roll" id="gacha-equipment">2 コインで回す</button></article><article class="shop-gacha-card"><h3>スキルガチャ</h3><div class="gacha-mini-art" id="gacha-art-skills">スキル</div><p class="gacha-mini-status" id="gacha-skills-status"></p><button class="small-btn gacha-roll" id="gacha-skills">2 コインで回す</button></article></div><div class="keyword-reward"><label for="shop-keyword">キーワード特典</label><input id="shop-keyword" maxlength="60" placeholder="キーワードを入力"><button id="shop-keyword-claim" class="small-btn">受け取る</button></div><button class="btn back" data-go="home">戻る</button></section><section class="screen" id="adventure"><h2 class="heading">冒険</h2><div class="panel battle-test-menu" id="scenario-panel"><h3>冒険の書</h3><div id="scenario-list" class="enemy-picker"></div><div id="enemy-test" class="dev-enemy-picker" hidden><h3>単独戦闘テスト</h3><div id="enemy-picker" class="enemy-picker"></div></div><div id="test-tools" class="test-tools" hidden><h3>開発テスト専用</h3><button class="btn" id="test-coins">＋20コイン</button><button class="btn" id="test-guest">未所持ゲストを取得・装備</button><button class="btn" id="test-novel">ノベル表示テスト</button><button class="btn" id="test-reset">テストデータ初期化</button><p id="test-feedback" role="status"></p></div></div><div class="panel run-panel" id="run-panel" hidden><div class="run-area" id="run-area"></div><h3 id="run-title"></h3><p id="run-notice">エリアを進めて戦闘に挑戦しましょう。</p><button class="btn" id="run-next">先に進む</button><p id="run-coins">獲得 <img class="run-coin-image" src="assets/ui/coin.png" alt="コイン"> ×0</p><button class="btn" id="run-return">帰還</button></div><button class="btn back" id="adventure-back" data-go="home">戻る</button></section><section class="screen" id="battle"><div class="battle-enemy"><div id="battle-enemy-art" class="battle-enemy-art"></div><h2 id="battle-enemy-name"></h2><div id="battle-enemy-hp" class="battle-hp"></div></div><div class="battle-bottom"><div id="battle-player-hp" class="battle-hp"></div><div id="battle-log" class="battle-log" aria-live="polite"></div><div class="battle-actions"><button class="btn" id="battle-attack">攻撃</button><button class="btn" id="battle-defend">防御</button><button class="btn" id="battle-skill">スキル</button><button class="btn" id="battle-item">アイテム</button></div><button class="btn battle-return" id="battle-return" hidden>テスト選択へ戻る</button></div></section><section class="screen" id="novel"><div class="novel-stage-art" id="novel-stage-art"></div><div class="novel-choices" id="novel-choices" hidden></div><div class="novel-history" id="novel-history" tabindex="-1" hidden><div class="novel-history-header">会話ログ <button type="button" id="novel-history-close">閉じる ×</button></div><div class="novel-history-list" id="novel-history-list"></div></div><div class="novel-bottom"><div class="novel-face" id="novel-face">NO IMAGE</div><div class="novel-dialogue" id="novel-dialogue" role="button" tabindex="0"><div class="novel-speaker" id="novel-speaker"></div><div class="novel-text" id="novel-text"></div><div class="novel-next">▼ 次へ</div></div></div></section><section class="screen" id="collection"><h2 class="heading">COLLECTION</h2><div class="collection-portrait" id="collection-portrait"></div><div class="collection-right"><div class="collection-mode-tabs"><button data-collection-mode="requests" class="active">依頼</button><button data-collection-mode="book">図鑑</button></div><div id="collection-requests-pane" class="collection-content"><div class="collection-progress" id="collection-progress"></div><div class="collection-tabs"><button data-collection-tab="all" class="active">すべて</button><button data-collection-tab="pending">未達成</button><button data-collection-tab="done">達成済み</button></div><div class="collection-list" id="collection-list"></div><div class="collection-detail" id="collection-detail">依頼を選択してください。</div></div><div id="collection-book-pane" class="collection-content" hidden><div id="collection-book-total"></div><div id="collection-book-progress"></div><div id="collection-book-list"></div><div id="collection-book-detail"></div></div></div><button class="btn back" data-go="home">戻る</button><button class="btn collection-report" id="collection-report">まとめて報告</button></section><section class="screen" id="items-page"><h2 class="heading">ITEMS</h2><div class="item-management"><div class="item-left"><div id="item-tabs"></div><div id="item-owned-list"></div></div><div id="item-detail"></div></div><button class="btn back" data-go="home">戻る</button></section><section class="screen" id="status"><h2 class="heading">STATUS</h2><div class="status-art"><img src="assets/characters/noka00.png" alt="前田ノカ" onerror="this.hidden=true;this.parentElement.classList.add('missing-art')"><span class="status-art-placeholder">前田ノカ立ち絵<br>（noka00.png 未配置）</span></div><div class="status-frame"><div id="status-level" class="status-level"></div><div id="stats"></div><div id="slots" class="slots"></div></div><button class="btn back" data-go="home">戻る</button></section><div class="modal" id="combat-choice"><div class="dialog picker-dialog"><h2 id="combat-choice-title">選択</h2><div id="combat-choice-list" class="picker-list"></div><button class="btn" id="combat-choice-close">戻る</button></div></div><div class="modal" id="reward-modal" role="dialog" aria-modal="true" aria-labelledby="reward-kind"><div class="dialog reward-dialog"><h2 id="reward-kind"></h2><div id="reward-art" class="reward-art"></div><p id="reward-name" class="reward-name"></p><button class="btn" id="reward-close">閉じる</button></div></div><button id="bgm-settings-open" class="bgm-settings-open" aria-label="サウンド設定">♪</button><div id="bgm-settings" class="bgm-settings" hidden><h3>サウンド設定</h3><label>BGM音量 <input id="bgm-volume" type="range" min="0" max="100" value="50"></label><label>SE音量 <input id="se-volume" type="range" min="0" max="100" value="70"></label><label><input id="bgm-mute" type="checkbox"> ミュート</label><button id="bgm-settings-close" class="small-btn">閉じる</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="fade" id="fade"></div><div class="modal" id="modal"><div class="dialog"><div id="modal-text"></div><div class="dialog-actions"><button class="btn" id="cancel">キャンセル</button><button class="btn" id="confirm">確認</button></div></div></div><div class="modal" id="picker"><div class="dialog picker-dialog"><h2 id="picker-title">装備を選択</h2><div class="picker-expanded"><div id="picker-list" class="picker-list"></div><div id="picker-detail" class="picker-detail"></div></div><button class="btn" id="picker-confirm">決定</button><button class="btn" id="picker-close">戻る</button></div></div></main></div><script src="js/core/game.js"></script></body></html>
